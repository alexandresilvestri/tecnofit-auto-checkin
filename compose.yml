x-node: &node
  image: node:24-slim
  working_dir: /app
  volumes:
    - .:/app
    - node_modules:/app/node_modules
    - web_node_modules:/app/apps/web/node_modules

services:
  moto:
    image: motoserver/moto:5.2.4

  deps:
    <<: *node
    command: npm install --no-save --no-audit --no-fund

  api:
    <<: *node
    command: npx tsx watch scripts/local-api.ts
    ports:
      - "3000:3000"
    environment:
      AWS_ENDPOINT_URL: http://moto:5000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      TABLE_MAIN: checkin-local-main
      TABLE_AUDIT: checkin-local-audit
      KMS_KEY_ID: alias/checkin-local-token
      ORIGIN_SECRET: local
      SCHEDULE_GROUP: checkin-local
      WORKER_ARN: arn:aws:lambda:us-east-1:123456789012:function:checkin-local-checkin-worker
      SCHEDULER_ROLE_ARN: arn:aws:iam::123456789012:role/checkin-local-scheduler-invoke
    depends_on:
      deps:
        condition: service_completed_successfully
      moto:
        condition: service_started
        restart: true

  web:
    <<: *node
    command: npm -w apps/web run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    environment:
      API_URL: http://api:3000
      VITE_COGNITO_DOMAIN: /cognito
    depends_on:
      deps:
        condition: service_completed_successfully
      api:
        condition: service_started

volumes:
  node_modules:
  web_node_modules:
