name: promote

on:
  workflow_dispatch:
    inputs:
      sha:
        type: string
        required: true

concurrency: deploy-prod

permissions:
  contents: read
  id-token: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release.yml
    with:
      env: prod
      workspace: checkin-prod
      sha: ${{ inputs.sha }}
    secrets:
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
